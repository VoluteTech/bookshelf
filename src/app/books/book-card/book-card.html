<article
  class="book-card"
  [class.is-read]="book().read"
  [style.opacity]="book().read ? 0.75 : 1"
  >
  <h3><a [routerLink]="['/books', book().id]">{{ book().title }}</a></h3>
  <p>by {{ book().author }}</p>

  @if (book().read) {
    <span class="badge">✓ Read</span>
  } @else {
    <span class="badge badge-unread">Not read yet</span>
  }

  <div class="actions">
    <a [routerLink]="['/books', book().id, 'edit']">Edit</a>
    <button (click)="onToggleClick()">Toggle read status</button>
    <button class="danger" (click)="onRemoveClick()">Delete</button>
  </div>
</article>
