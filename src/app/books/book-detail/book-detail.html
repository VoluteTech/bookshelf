@if (loading()) {
  <p>Loading...</p>
} @else {
  @if (book(); as b) {
    <h2>{{ b.title }}</h2>
    <p>by {{ b.author }}</p>
    <p>{{ b.read ? 'Read' : 'Not read yet' }}</p>
    <a [routerLink]="['/books', b.id, 'edit']">Edit</a>
  } @else {
    <p>Book not found.</p>
  }
}
<a routerLink="/">← Back to list</a>
